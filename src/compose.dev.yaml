name: gateways-dev

# BTCPay, Bitcoin Core y NBXplorer se gestionan en el VPS, no en este stack local.
services:
  app:
    profiles: ["app"]
    build:
      context: .
      target: development
    command: sh -c "pnpm install --frozen-lockfile && exec pnpm dev --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the app in .env}
      DATABASE_COMPOSE_HOST: db
      UMAMI_API_URL: ${UMAMI_API_URL:-https://uma.mauriciodmo.com}
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-blog-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  db:
    build:
      context: .
      dockerfile: infrastructure/postgres/Dockerfile
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gateways}
      POSTGRES_USER: ${POSTGRES_USER:-gateways}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateways_dev}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:1.0.4
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_ACCESS_KEY:?Set RUSTFS_ROOT_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_SECRET_KEY:?Set RUSTFS_ROOT_SECRET_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  rustfs-init:
    image: rustfs/rc:v0.1.36
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until /usr/bin/rc alias set local http://rustfs:9000 "$${RUSTFS_ROOT_ACCESS_KEY}" "$${RUSTFS_ROOT_SECRET_KEY}"; do sleep 2; done;
        /usr/bin/rc bucket list local/ | grep -Fq "$${S3_BUCKET}" || /usr/bin/rc bucket create "local/$${S3_BUCKET}"
    environment:
      RUSTFS_ROOT_ACCESS_KEY: ${RUSTFS_ROOT_ACCESS_KEY:?Set RUSTFS_ROOT_ACCESS_KEY in .env}
      RUSTFS_ROOT_SECRET_KEY: ${RUSTFS_ROOT_SECRET_KEY:?Set RUSTFS_ROOT_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-blog-media}

volumes:
  postgres_data:
  rustfs_data:
  node_modules:
  next_cache:
